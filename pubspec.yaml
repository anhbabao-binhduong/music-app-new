name: music_app
description: A modern cross-platform music player app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  flutter:
    sdk: flutter

  # ─── Audio Engine ───────────────────────────────────────
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.13
  audio_session: ^0.2.2
  uuid: ^4.5.3

  # ─── State Management ───────────────────────────────────
  flutter_bloc: ^9.1.1
  provider: ^6.1.1
  equatable: ^2.0.5

  # ─── Data & Storage ─────────────────────────────────────
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2

  # ─── Network ────────────────────────────────────────────
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  async: ^2.11.0  # cho StreamGroup.merge
  # ─── UI & Utilities ─────────────────────────────────────
  google_fonts: ^8.0.2
  animations: ^2.0.11
  palette_generator: ^0.3.3+3
  rxdart: ^0.28.0
  get_it: ^9.2.1
  dartz: ^0.10.1
  permission_handler: ^12.0.1
  supabase_flutter: ^2.12.0
  google_sign_in: ^6.2.2
  share_plus: ^12.0.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^6.0.0
  device_preview: ^1.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
