name: music_app
description: A modern cross-platform music player app.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Audio Engine ───────────────────────────────────────
  just_audio: ^0.9.36              # Core audio playback engine
  just_audio_background: ^0.0.1-beta.11  # Background playback bridge
  audio_service: ^0.18.13          # Media notification & background service
  audio_session: ^0.1.18           # Manage audio focus & interruptions

  # ─── State Management ───────────────────────────────────
  flutter_bloc: ^8.1.3             # BLoC pattern
  provider: ^6.1.1                 # Provider (dùng cho theme/global state)
  equatable: ^2.0.5                # Value equality cho Bloc states

  # ─── Data & Storage ─────────────────────────────────────
  hive: ^2.2.3                     # Local database (lưu playlist)
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1            # App directories
  shared_preferences: ^2.2.2       # Settings (dark mode, volume...)

  # ─── Network ────────────────────────────────────────────
  dio: ^5.4.0                      # HTTP client
  cached_network_image: ^3.3.1     # Cache album art

  # ─── UI & Utilities ─────────────────────────────────────
  google_fonts: ^6.1.0             # Custom fonts
  animations: ^2.0.11              # Page transition animations
  palette_generator: ^0.3.3+3      # Extract color from album art
  rxdart: ^0.27.7                  # Reactive streams (kết hợp với audio_service)
  get_it: ^7.6.4                   # Service locator / DI
  dartz: ^0.10.1                   # Functional programming (Either, Option)
  permission_handler: ^11.1.0      # Runtime permissions (storage/mic)

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/YourFont-Regular.ttf
        - asset: assets/fonts/YourFont-Bold.ttf
          weight: 700