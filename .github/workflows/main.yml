name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Tránh chạy concurrent jobs trên cùng branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.0'   # Pin version để tránh breaking changes
  JAVA_VERSION: '17'

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1: Analyze + Test
  # ═══════════════════════════════════════════════════════════
  test:
    name: 🧪 Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true                   # Cache Flutter SDK giữa các runs

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔨 Run build_runner (Hive adapters)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🔍 Analyze code (dart analyze)
        run: flutter analyze --fatal-infos

      - name: 🎨 Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🧪 Run unit & widget tests
        run: |
          flutter test \
            --coverage \
            --reporter=github \
            test/unit/ test/widget/

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/lcov.info
          fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════
  # JOB 2: Build APK (Debug) — chạy sau khi test pass
  # ═══════════════════════════════════════════════════════════
  build-apk-debug:
    name: 🤖 Build Android Debug APK
    runs-on: ubuntu-latest
    needs: test                          # Chỉ build nếu test pass

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔨 Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🏗️ Build Debug APK
        run: flutter build apk --debug

      - name: 📤 Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # JOB 3: Build Release APK — chỉ khi push lên main
  # ═══════════════════════════════════════════════════════════
  build-apk-release:
    name: 🚀 Build Android Release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔨 Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # Decode keystore từ GitHub Secrets
      - name: 🔐 Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/keystore.jks

      - name: 📝 Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: 🏗️ Build Release APK
        run: flutter build apk --release --shrink

      - name: 🏗️ Build App Bundle (AAB) cho Play Store
        run: flutter build appbundle --release

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # JOB 4: Build iOS (macOS runner) — chỉ trên main
  # ═══════════════════════════════════════════════════════════
  build-ios:
    name: 🍎 Build iOS (no-codesign)
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔨 Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🍎 Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: 🏗️ Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: 📤 Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
